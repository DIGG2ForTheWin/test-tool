# ---- Enviroment setup ----
infrastructure:
  region: eu-north-1

  machines:
    - name: lab-1
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: lab-2
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: monitor
      instance_type: t3.small
      storage_gb: 8      # OLD: storage_gb: 8gb  (Terraform needs a number)
            
monitoring:
  machine: monitor
  
# ---- Domibud instances location ----
nodes:
  blue:
    port: 8081
    machine: lab-1
  red:
    port: 8082
    machine: lab-2

# ---- Tests ----

pmode: https://github.com/<owner>/test-tool/blob/main/pmodes/v1.xml

tests:
  - name: small_files
    from: red
    to: blue
    file_size_kb: 10
    count: 100
  - name: large_files
    from: red
    to: blue
    file_size_kb: 20000
    count: 5