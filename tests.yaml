# ---- Enviroment setup ----
infrastructure:
  region: eu-north-1

  machines:
    - name: lab-1
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: lab-2
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: monitor
      instance_type: t3.small
      storage_gb: 8      # OLD: storage_gb: 8gb  (Terraform needs a number)
            
monitoring:
  machine: monitor
  
# ---- Domibud instances location ----
nodes:
  blue:
    port: 8081
    machine: lab-1
  red:
    port: 8082
    machine: lab-2

# --------------------- tester (test program) ---------------------
# Node names (red/blue) are used as AS4 party ids and must match the PMode.
tester:
  pmodes:
    blue: pmode/blue_pmode.xml        # relative to this file; version chosen with git
    red: pmode/red_pmode.xml

  message:                          # header values for metadata.xml – must match the PMode
    party_id_type: urn:oasis:names:tc:ebcore:partyid-type:unregistered
    sender_role: http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/sender
    receiver_role: http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/receiver
    service: bdx:noprocess
    service_type: tc1
    action: TC1Leg1

  tests:
    - name: small_files
      from: blue
      to: red
      size: 50 KiB   #Use KiB/MiB/GiB 
      count: 10
    - name: dicom_sample
      from: blue
      to: red
      file: dicom/0002.DCM    # relative to <data_root>/testfiles