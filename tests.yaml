# ---- Enviroment setup ----
infrastructure:
  region: eu-north-1

  machines:
    - name: lab-1
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: lab-2
      instance_type: c7i-flex.large
      storage_gb: 16
    - name: monitor
      instance_type: t3.small
      storage_gb: 8      # OLD: storage_gb: 8gb  (Terraform needs a number)
            
monitoring:
  machine: monitor
  
# ---- Domibud instances location ----
nodes:
  blue:
    port: 8081
    machine: lab-1
  red:
    port: 8082
    machine: lab-2
# ---- Domibus instance locations ----
# The WS plugin requires a plugin user; the admin login for the GUI does not work.
# Credentials are read from environment variables (see .env.example).
targets:
  domibus-red:
    url: http://domibus-red:8080/domibus
    user: ${DOMIBUS_RED_USER}
    password: ${DOMIBUS_RED_PASSWORD}
  domibus-blue:
    url: http://domibus-blue:8080/domibus
    user: ${DOMIBUS_BLUE_USER}
    password: ${DOMIBUS_BLUE_PASSWORD}

pmode:
  repo: org/domibus-pmodes
  path: pmodes/red-blue.xml

# ---- Tests ----
tests:
  - name: small_files
    from: domibus-red
    to: domibus-blue
    file_size_kb: 10
    count: 10
  - name: medium_under_2gb
    from: domibus-red
    to: domibus-blue
    file_size_kb: 500000   # ~500 MB
    count: 1
  - name: large_over_2gb
    from: domibus-red
    to: domibus-blue
    file_size_kb: 2300000  # ~2.2 GB 
    count: 1
