# ---- Enviroment setup ----
infrastructure:
  region: eu-north-1
  instances:
    - name: red
      instance_type: t3.large
    - name: blue
      instance_type: t3.large

machines:
  - name: lab-1
    instance_type: c7i-flex.large     
    storage_gb: 30                    
    image: ghcr.io/<owner>/domibus:5.2.1.3
    nodes: [blue, red]               
    pmode: https://github.com/<owner>/test-tool/blob/main/pmodes/v1.xml   

# ---- Domibud instances location ----
targets:
  red:
    url: http://localhost:8080/domibus
    user: admin
    password: 123456
  blue:
    url: http://localhost:9080/domibus
    user: admin
    password: 123456

pmode:
  repo: org/domibus-pmodes
  path: pmodes/red-blue.xml

# ---- Tests ----
tests:
  - name: small_files
    from: red
    to: blue
    file_size_kb: 10
    count: 100
  - name: large_files
    from: red
    to: blue
    file_size_kb: 20000
    count: 5