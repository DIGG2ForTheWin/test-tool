services:
  blue:
    image: eclipse-temurin:21-jre
    container_name: blue-domibus
    working_dir: /opt/domibus
    command: ["bin/catalina.sh", "run"]
    volumes:
      - /opt/lab/blue/domibus:/opt/domibus
    ports:
      - "8081:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    restart: unless-stopped

  red:
    image: eclipse-temurin:21-jre
    container_name: red-domibus
    working_dir: /opt/domibus
    command: ["bin/catalina.sh", "run"]
    volumes:
      - /opt/lab/red/domibus:/opt/domibus
    ports:
      - "8082:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    restart: unless-stopped
 
  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"   # scraped by Prometheus on the monitor machine

  node-exporter:
    image: prom/node-exporter
    hostname: ${MACHINE:-node}
    ports:
      - "9100:9100"   # scraped by Prometheus on the monitor machine
