services:
  blue:
    image: ghcr.io/sputtifrutti/domibus
    container_name: domibus-blue
    environment:
      # CATALINA_OPTS is empty in the image (its setenv.sh only extends JAVA_OPTS), so nothing is replaced
      CATALINA_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml
        -Dhikaricp.configurationFile=/opt/jmx/hikari.properties
    volumes:
      - ./blue/fs:/opt/domibus/fs_plugin_data
      - ./jmx:/opt/jmx:ro   # staged by scripts/install_jmx_exporter.sh
    ports:
      - "8081:8080"
      - "9404:9404"   # JMX exporter, scraped by Prometheus on the monitor machine
    restart: unless-stopped

  red:
    image: ghcr.io/sputtifrutti/domibus
    container_name: domibus-red
    environment:
      CATALINA_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml
        -Dhikaricp.configurationFile=/opt/jmx/hikari.properties
    volumes:
      - ./red/fs:/opt/domibus/fs_plugin_data
      - ./jmx:/opt/jmx:ro
    ports:
      - "8082:8080"
      - "9404:9404"
    restart: unless-stopped
 
  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"   # scraped by Prometheus on the monitor machine

  node-exporter:
    image: prom/node-exporter
    hostname: ${MACHINE:-node}
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
